<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Client - ADcoach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
    }

    /* Conteneur principal global */
    .client-container {
      background: #ffffff;
      width: 1000px;
      max-width: 95%;
      height: 620px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      padding: 35px;
      gap: 50px;
      position: relative;
    }

    /* Sidebar de gauche */
    .sidebar-card {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      width: 300px;
      border-radius: 20px;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar-top {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-card h2 {
      color: #E95300;
      font-size: 28px;
      font-weight: 900;
    }

    .sidebar-card p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    .btn-logout {
      background: #f1f5f9;
      color: #64748b;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      align-self: flex-start;
    }

    .btn-logout:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    /* Partie droite */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .welcome-title {
      font-size: 32px;
      font-weight: bold;
      color: #1e293b;
      text-align: right;
      margin-bottom: 20px;
    }

    .welcome-title span {
      color: #E95300;
    }

    /* Contenu de la zone client */
    .client-content-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 30px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 15px;
    }

    .client-content-box h3 {
      font-size: 22px;
      font-weight: 900;
      color: #1e293b;
    }

    .client-content-box p {
      font-size: 14px;
      color: #64748b;
      max-width: 450px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="client-container">
    <!-- Sidebar gauche -->
    <div class="sidebar-card">
      <div class="sidebar-top">
        <h2>Mon Espace</h2>
        <p>Retrouve ton programme personnalisé ainsi que tous tes services actifs.</p>
      </div>
      <button id="btn-logout" class="btn-logout">Se déconnecter</button>
    </div>

    <!-- Contenu droit -->
    <div class="main-content">
      <h1 class="welcome-title">Bonjour, <span id="user-prenom">Chargement...</span></h1>
      
      <div class="client-content-box">
        <h3>Ton programme est en cours de préparation</h3>
        <p>Toutes les étapes de validation sont complétées avec succès. Ton espace personnalisé s'affiche ici.</p>
      </div>
    </div>
  </div>

  <!-- Script de sécurité, de vérification des accès et de chargement -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabaseUrl = 'https://gyojzwmknilkglcywvck.supabase.co'
    const supabaseAnonKey = 'sb_publishable_UoIyjRbVbUoURw4psuk68w_4t_Z4iS8'
    const supabase = createClient(supabaseUrl, supabaseAnonKey)

    async function checkAccessAndLoadClient() {
      // 1. Vérification de la session active
      const { data: { session } } = await supabase.auth.getSession()

      if (!session) {
        window.location.href = '../index.html'
        return
      }

      const userId = session.user.id
      const prenom = session.user.user_metadata?.prenom || "Champion"
      document.getElementById('user-prenom').innerText = prenom

      // 2. Récupération des données dans la table 'profiles'
      const { data: profile, error } = await supabase
        .from('profiles')
        .select('questionnaire, payement, statut_abonnement')
        .eq('id', userId)
        .single()

      if (error || !profile) {
        console.error("Erreur lors de la récupération du profil :", error)
        return
      }

      // 3. Redirection 1 : S'il n'a pas rempli le questionnaire
      if (!profile.questionnaire) {
        window.location.href = 'questionnaire.html'
        return
      }

      // 4. Redirection 2 : S'il n'a pas payé OU si l'abonnement est résilié
      const isPaye = profile.payement === true
      const statutAbo = profile.statut_abonnement

      if (!isPaye || statutAbo === 'inactif') {
        window.location.href = 'payement.html'
        return
      }
    }

    checkAccessAndLoadClient()

    // Gestion du bouton de déconnexion
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = '../index.html'
    })
  </script>

</body>
</html>
