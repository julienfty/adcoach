<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Questionnaire - ADcoach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8fafc;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
    }

    /* Conteneur principal global */
    .questionnaire-container {
      background: #ffffff;
      width: 1000px;
      max-width: 95%;
      height: 620px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      padding: 35px;
      gap: 50px;
      position: relative;
    }

    /* Sidebar de gauche avec la carte blanche et son ombre douce */
    .sidebar-card {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      width: 300px;
      border-radius: 20px;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-card h2 {
      color: #E95300;
      font-size: 28px;
      font-weight: 900;
    }

    .sidebar-card p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Partie droite contenant le texte de bienvenue et les questions */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .welcome-title {
      font-size: 32px;
      font-weight: bold;
      color: #1e293b;
      text-align: right;
      margin-bottom: 10px;
    }

    .welcome-title span {
      color: #E95300;
    }

    /* Liste des questions */
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .question-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .question-group label {
      font-weight: bold;
      color: #1e293b;
      font-size: 15px;
    }

    .question-group input {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background-color: #f8fafc;
      outline: none;
      font-size: 14px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease;
    }

    .question-group input:focus {
      border-color: #E95300;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(233, 83, 0, 0.1);
    }

    /* Bouton suivant en bas à droite */
    .btn-suivant {
      align-self: flex-end;
      background: #E95300;
      color: white;
      border: none;
      padding: 12px 35px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(233, 83, 0, 0.35);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-suivant:hover {
      background-color: #C34600;
      transform: translateY(-1px);
    }

    .btn-suivant:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="questionnaire-container">
    <!-- Sidebar gauche -->
    <div class="sidebar-card">
      <h2>Questionnaire</h2>
      <p>ce questionnaire permet de mieux perfectionné la création ton programme personnalisé.</p>
      <p>à l'issue de ce questionnaire tes réponses seront envoyées pour créer ton programme.*</p>
    </div>

    <!-- Contenu droit -->
    <div class="main-content">
      <h1 class="welcome-title">Bonjour, <span id="user-prenom">Chargement...</span></h1>
      
      <form id="questionnaire-form" class="questions-list">
        <div class="question-group">
          <label>question n1</label>
          <input type="text" required />
        </div>
        <div class="question-group">
          <label>question n2</label>
          <input type="text" required />
        </div>
        <div class="question-group">
          <label>question n3</label>
          <input type="text" required />
        </div>
        <div class="question-group">
          <label>question n4</label>
          <input type="text" required />
        </div>
        <div class="question-group">
          <label>question n5</label>
          <input type="text" required />
        </div>
        
        <button type="submit" class="btn-suivant">suivant</button>
      </form>
    </div>
  </div>

  <!-- Script de sécurité et de récupération dynamique du prénom Supabase -->
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabaseUrl = 'https://gyojzwmknilkglcywvck.supabase.co'
    const supabaseAnonKey = 'sb_publishable_UoIyjRbVbUoURw4psuk68w_4t_Z4iS8'
    const supabase = createClient(supabaseUrl, supabaseAnonKey)

    async function checkAuthAndLoadUser() {
      const { data: { session } } = await supabase.auth.getSession()

      // Si l'utilisateur n'est pas connecté, on le renvoie à l'accueil
      if (!session) {
        window.location.href = '../index.html'
        return
      }

      // Récupération dynamique du prénom depuis les métadonnées Supabase
      const user = session.user
      const prenom = user.user_metadata?.prenom || "Champion"
      
      document.getElementById('user-prenom').innerText = prenom
    }

    checkAuthAndLoadUser()

    // Gestion de la soumission et mise à jour de la base de données
    const form = document.getElementById('questionnaire-form')
    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return

      // Mise à jour de la table 'profiles' pour passer 'questionnaire' à true
      const { error } = await supabase
        .from('profiles')
        .update({ questionnaire: true })
        .eq('id', session.user.id)

      if (error) {
        console.error("Erreur lors de la mise à jour :", error)
        alert("Une erreur est survenue.")
      } else {
        // Redirection vers la page de paiement après succès
        window.location.href = 'payement.html'
      }
    })
  </script>

</body>
</html>
