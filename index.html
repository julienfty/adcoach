<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ADcoach</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- SECTION HERO (La page d'accueil avec l'image de fond) -->
  <header class="hero">
    <div class="hero-content">
     <h1 class="hero-title">
  <span class="brand-ad">AD</span><span class="brand-coach">coach</span>
</h1>
      
      <!-- Tes deux boutons centraux -->
      <div class="hero-buttons">
        <button id="open-popup-btn" class="btn-primary">
          s'inscrire
          <span class="btn-subtitle">149€/12sem*</span>
        </button>
        <a href="#" class="btn-secondary">se connecter</a>
      </div>

      <!-- Le lien "découvrir" tout en bas -->
      <a href="#" class="hero-discover">
        découvrir
        <span class="arrow-down"></span>
      </a>
    </div>
  </header>

  <!-- LA POPUP D'INSCRIPTION (Masquée au chargement) -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="close-popup-btn" class="close-btn">&times;</button>
      
      <form id="signup-form">
        <h2>Inscription</h2>
        <input type="email" id="signup-email" placeholder="Ton e-mail" required />
        <input type="password" id="signup-password" placeholder="Ton mot de passe" required />
        <button type="submit">s'inscrire</button>
      </form>
    </div>
  </div>

  <!-- Ton script JavaScript -->
  <script type="module" src="index.js"></script>
</body>
</html>
