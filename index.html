<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ADcoach</title>
  <link rel="stylesheet" href="index.css"> <!-- Optionnel si tu mets le CSS à part -->
</head>
<body>

  <!-- Bouton principal sur la page d'accueil -->
  <button id="open-popup-btn">S'inscrire</button>

  <!-- La Popup (Masquée au départ) -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="close-popup-btn" class="close-btn">&times;</button>
      
      <form id="signup-form">
        <h2>Inscription</h2>
        <input type="email" id="signup-email" placeholder="Ton e-mail" required />
        <input type="password" id="signup-password" placeholder="Ton mot de passe" required />
        <button type="submit">S'inscrire</button>
      </form>
    </div>
  </div>

  <!-- Ton script JavaScript -->
  <script type="module" src="index.js"></script>
</body>
</html>
