<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ADcoach</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- SECTION HERO -->
  <header class="hero">
    <div class="hero-content">
      <h1 class="hero-title">
        <span class="brand-ad">AD</span><span class="brand-coach">coach</span>
      </h1>
      
      <div class="hero-buttons">
        <button id="open-popup-btn" class="btn-primary">
          s'inscrire
          <span class="btn-subtitle">149€/12sem*</span>
        </button>
        <a href="#" id="open-login-btn" class="btn-secondary">se connecter</a>
      </div>

      <a href="#" class="hero-discover">
        <span class="discover-text">découvrir</span>
        <span class="arrow-down"></span>
      </a>
    </div>
  </header>

  <!-- POPUP UNIQUE (INSCRIPTION / CONNEXION) -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="close-popup-btn" class="close-btn">&times;</button>
      
      <!-- En-tête blanc avec le logo -->
      <div class="modal-header-brand">
        <span class="brand-ad">AD</span><span class="brand-coach">coach</span>
      </div>

      <!-- Barre des onglets (Orange) -->
      <div class="modal-tabs">
        <button type="button" id="tab-signup-btn" class="tab-btn active">Inscription</button>
        <button type="button" id="tab-signin-btn" class="tab-btn">Connexion</button>
      </div>

      <!-- Conteneur blanc des formulaires -->
      <div class="modal-form-container">
        
        <!-- Formulaire d'Inscription -->
        <form id="signup-form" class="auth-form">
          <div class="form-group">
            <label for="signup-nom">Nom<span class="required">*</span></label>
            <input type="text" id="signup-nom" placeholder="exemple : Moreau" required />
          </div>
          <div class="form-group">
            <label for="signup-prenom">Prénom<span class="required">*</span></label>
            <input type="text" id="signup-prenom" placeholder="exemple : Gabriel" required />
          </div>
          <div class="form-group">
            <label for="signup-email">E-mail<span class="required">*</span></label>
            <input type="email" id="signup-email" placeholder="exemple : GabMoreau@gmail.com" required />
          </div>
          <div class="form-group">
            <label for="signup-password">Mot de passe<span class="required">*</span></label>
            <input type="password" id="signup-password" placeholder="Au moins 6 lettres" required />
          </div>
          <button type="submit" class="btn-submit">s'inscrire</button>
        </form>

        <!-- Formulaire de Connexion (Caché par défaut) -->
        <form id="signin-form" class="auth-form" style="display: none;">
          <div class="form-group">
            <label for="signin-email">E-mail<span class="required">*</span></label>
            <input type="email" id="signin-email" placeholder="exemple : GabMoreau@gmail.com" required />
          </div>
          <div class="form-group">
            <label for="signin-password">Mot de passe<span class="required">*</span></label>
            <input type="password" id="signin-password" placeholder="Au moins 6 lettres" required />
          </div>
          <button type="submit" class="btn-submit">se connecter</button>
        </form>

      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
