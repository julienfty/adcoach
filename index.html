<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ADcoach</title>
  <link rel="stylesheet" href="index.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TITRE/FOND -->
  <header class="hero">
    <div class="hero-content">
     <h1 class="hero-title">
  <span class="brand-ad">AD</span><span class="brand-coach">coach</span>
</h1>
      
      <!-- INS/CON -->
      <div class="hero-buttons">
        <button id="open-popup-btn" class="btn-primary">
          s'inscrire
          <span class="btn-subtitle">149€/12sem*</span>
        </button>
        <a href="#" class="btn-secondary">se connecter</a>
      </div>

      <!-- EFFET DECOUVRIR -->
      <a href="#" class="hero-discover">
        <span class="discover-text">découvrir</span>
        <span class="arrow-down"></span>
      </a>
    </div>
  </header>

  <!-- POPUP D'INSCRIPTION -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="close-popup-btn" class="close-btn">&times;</button>
      
      <form id="signup-form">
        <h2>Inscription</h2>
        <input type="email" id="signup-email" placeholder="Ton e-mail" required />
        <input type="password" id="signup-password" placeholder="Ton mot de passe" required />
        <button type="submit">s'inscrire</button>
      </form>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
