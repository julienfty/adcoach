<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Site</title>
  <link rel="stylesheet" href="style.css"> <!-- Optionnel si tu mets le CSS à part -->
  <style>
    /* Styles rapides pour la popup */
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Le bouton pour ouvrir */
    #open-popup-btn {
      padding: 12px 24px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    #open-popup-btn:hover {
      background: #16a34a;
    }

    /* Le fond sombre derrière la popup (caché par défaut) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none; /* Caché au chargement */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    /* La boîte de la popup */
    .modal-content {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      position: relative;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Bouton pour fermer (la croix) */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: white;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    form button[type="submit"] {
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Bouton principal sur la page d'accueil -->
  <button id="open-popup-btn">S'inscrire</button>

  <!-- La Popup (Masquée au départ) -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <button id="close-popup-btn" class="close-btn">&times;</button>
      
      <form id="signup-form">
        <h2>Inscription</h2>
        <input type="email" id="signup-email" placeholder="Ton e-mail" required />
        <input type="password" id="signup-password" placeholder="Ton mot de passe" required />
        <button type="submit">S'inscrire</button>
      </form>
    </div>
  </div>

  <!-- Ton script JavaScript -->
  <script type="module" src="index.js"></script>
</body>
</html>
